name: Docker Compose

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configurations
        env:
          OPENAI_TUNNEL_ID: tunnel_0123456789abcdef0123456789abcdef
          GIT_IDENTITY_NAME: CI
          GIT_IDENTITY_EMAIL: ci@example.invalid
        run: python scripts/check_compose.py
