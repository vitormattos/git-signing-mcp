name: Docker Compose

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configurations
        env:
          OPENAI_TUNNEL_ID: tunnel_0123456789abcdef0123456789abcdef
          GIT_IDENTITY_NAME: CI
          GIT_IDENTITY_EMAIL: ci@example.invalid
        run: |
          mkdir -p secrets
          printf '%s\n' 'dummy-runtime-key' > secrets/openai_tunnel_runtime_api_key
          printf '%s\n' '0123456789abcdef0123456789abcdef' > secrets/mcp_tunnel_shared_secret
          printf '%s\n' 'dummy-role-id' > secrets/openbao_role_id
          printf '%s\n' 'dummy-secret-id' > secrets/openbao_secret_id
          head -c 32 /dev/zero > secrets/openbao_static_seal_key

          docker compose config --quiet
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.openbao.yml \
            config --quiet
