name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate Compose configuration
        env:
          OPENAI_TUNNEL_ID: tunnel_0123456789abcdef0123456789abcdef
          GIT_IDENTITY_NAME: CI
          GIT_IDENTITY_EMAIL: ci@example.invalid
        run: |
          mkdir -p secrets
          printf '%s\n' 'dummy-runtime-key' > secrets/openai_tunnel_runtime_api_key
          printf '%s\n' '0123456789abcdef0123456789abcdef' > secrets/mcp_tunnel_shared_secret
          printf '%s\n' 'dummy-role-id' > secrets/openbao_role_id
          printf '%s\n' 'dummy-secret-id' > secrets/openbao_secret_id
          docker compose config --quiet
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: git-signing-mcp:test
