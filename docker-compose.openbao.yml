# Optional local OpenBao service.
# Symlink this file as docker-compose.override.yml on hosts that should run
# OpenBao beside the MCP. docker-compose.override.yml is intentionally ignored.

services:
  openbao:
    image: openbao/openbao:2.7.1
    restart: unless-stopped
    command:
      - server
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - ./deploy/openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
      - ./volumes/openbao:/openbao/file
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_swappiness: 0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bao status >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  mcp:
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      OPENBAO_ADDR: http://openbao:8200
