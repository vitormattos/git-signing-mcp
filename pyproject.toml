[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "git-signing-mcp"
version = "0.1.0"
description = "Self-hosted MCP server for cryptographically signed Git commits with DCO enforcement."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "pydantic>=2.12,<3",
  "starlette>=0.48,<2",
  "uvicorn>=0.37,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.13,<1"
]

[project.scripts]
git-signing-gpg-wrapper = "git_signing_mcp.gpg_wrapper:main"

[tool.hatch.build.targets.wheel]
packages = ["src/git_signing_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
