services:
  mcp:
    build:
      context: .
    image: git-signing-mcp:local
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - private
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tunnel-client:
    image: ghcr.io/openai/tunnel-client:v0.0.15
    restart: unless-stopped
    depends_on:
      mcp:
        condition: service_healthy
    environment:
      CONTROL_PLANE_API_KEY: ${OPENAI_TUNNEL_RUNTIME_API_KEY:?set OPENAI_TUNNEL_RUNTIME_API_KEY}
      CONTROL_PLANE_TUNNEL_ID: ${OPENAI_TUNNEL_ID:?set OPENAI_TUNNEL_ID}
      MCP_SERVER_URL: http://mcp:8080/mcp
      MCP_EXTRA_HEADERS: "X-Git-Signing-Auth: ${MCP_TUNNEL_SHARED_SECRET:?set MCP_TUNNEL_SHARED_SECRET}"
      CONTROL_PLANE_MAX_INFLIGHT_REQUESTS: "2"
      LOG_LEVEL: info
      LOG_FORMAT: json
      HEALTH_LISTEN_ADDR: 127.0.0.1:8080
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  private:
    driver: bridge
