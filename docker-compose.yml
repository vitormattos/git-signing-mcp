services:
  mcp:
    build:
      context: .
    image: git-signing-mcp:local
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
