services:
  mcp:
    image: ${MCP_IMAGE:-ghcr.io/vitormattos/git-signing-mcp:latest}
    restart: unless-stopped
    environment:
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-8080}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-mcp,mcp:8080}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      MCP_TUNNEL_SHARED_SECRET_FILE: /run/secrets/mcp_tunnel_shared_secret
      ALLOWED_REPOSITORIES: ${ALLOWED_REPOSITORIES:-*/*}
      PROTECTED_BRANCH_PATTERNS: ${PROTECTED_BRANCH_PATTERNS:-main,master,trunk,production,release/*}
      ALLOW_PROTECTED_BRANCH_WRITES: ${ALLOW_PROTECTED_BRANCH_WRITES:-false}
      MAX_WRITES_PER_MINUTE: ${MAX_WRITES_PER_MINUTE:-10}
      MAX_CONCURRENT_WRITES: ${MAX_CONCURRENT_WRITES:-1}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-1048576}
      MAX_CHANGES: ${MAX_CHANGES:-100}
      MAX_PATCH_BYTES: ${MAX_PATCH_BYTES:-5242880}
      GIT_IDENTITY_NAME: ${GIT_IDENTITY_NAME:?set GIT_IDENTITY_NAME}
      GIT_IDENTITY_EMAIL: ${GIT_IDENTITY_EMAIL:?set GIT_IDENTITY_EMAIL}
      SIGNING_FORMAT: ${SIGNING_FORMAT:-ssh}
      SIGNING_KEY_SOURCE: ${SIGNING_KEY_SOURCE:-openbao}
      SIGNING_KEY_FILE: ${SIGNING_KEY_FILE:-}
      GITHUB_TOKEN_SOURCE: ${GITHUB_TOKEN_SOURCE:-openbao}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      OPENBAO_ADDR: ${OPENBAO_ADDR:-http://openbao:8200}
      OPENBAO_NAMESPACE: ${OPENBAO_NAMESPACE:-}
      OPENBAO_ROLE_ID_FILE: /run/secrets/openbao_role_id
      OPENBAO_SECRET_ID_FILE: /run/secrets/openbao_secret_id
      OPENBAO_AUTH_MOUNT: ${OPENBAO_AUTH_MOUNT:-approle}
      OPENBAO_KV_MOUNT: ${OPENBAO_KV_MOUNT:-secret}
      OPENBAO_SIGNING_PATH: ${OPENBAO_SIGNING_PATH:-git-signing/signing}
      OPENBAO_SIGNING_FIELD: ${OPENBAO_SIGNING_FIELD:-private_key}
      OPENBAO_SIGNING_PASSPHRASE_FIELD: ${OPENBAO_SIGNING_PASSPHRASE_FIELD:-passphrase}
      OPENBAO_GITHUB_PATH: ${OPENBAO_GITHUB_PATH:-git-signing/github}
      OPENBAO_GITHUB_FIELD: ${OPENBAO_GITHUB_FIELD:-token}
      SECRET_CACHE_TTL_SECONDS: ${SECRET_CACHE_TTL_SECONDS:-300}
      REPO_CACHE_DIR: ${REPO_CACHE_DIR:-/tmp/git-signing-mcp-repos}
      GPG_HOME_DIR: ${GPG_HOME_DIR:-/tmp/git-signing-mcp-gnupg}
      VERIFY_RETRIES: ${VERIFY_RETRIES:-6}
    secrets:
      - mcp_tunnel_shared_secret
      - openbao_role_id
      - openbao_secret_id
    depends_on:
      openbao:
        condition: service_healthy
    networks:
      frontend:
      backend:
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${MCP_TMPFS_SIZE:-1g}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  openbao:
    image: openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
    restart: unless-stopped
    command:
      - server
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - ./deploy/openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
      - ./volumes/openbao:/openbao/file
    secrets:
      - openbao_static_seal_key
    networks:
      backend:
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_swappiness: 0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bao status >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  tunnel-client:
    image: ghcr.io/openai/tunnel-client:0.0.16@sha256:4605ea909701668d3bdcbe6152558e068e24006aa96ca5518ca67f786a1bce13
    restart: unless-stopped
    depends_on:
      mcp:
        condition: service_healthy
    command:
      - --control-plane.api-key=file:/run/secrets/openai_tunnel_runtime_api_key
      - --mcp.extra-headers
      - "X-Git-Signing-Auth: file:/run/secrets/mcp_tunnel_shared_secret"
    environment:
      CONTROL_PLANE_TUNNEL_ID: ${OPENAI_TUNNEL_ID:?set OPENAI_TUNNEL_ID}
      MCP_SERVER_URL: http://mcp:8080/mcp
      CONTROL_PLANE_MAX_INFLIGHT_REQUESTS: "2"
      LOG_LEVEL: info
      LOG_FORMAT: json
      HEALTH_LISTEN_ADDR: 127.0.0.1:8080
    secrets:
      - openai_tunnel_runtime_api_key
      - mcp_tunnel_shared_secret
    networks:
      frontend:
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

secrets:
  openai_tunnel_runtime_api_key:
    file: ${OPENAI_TUNNEL_RUNTIME_API_KEY_FILE:-./secrets/openai_tunnel_runtime_api_key}
  mcp_tunnel_shared_secret:
    file: ${MCP_TUNNEL_SHARED_SECRET_FILE:-./secrets/mcp_tunnel_shared_secret}
  openbao_role_id:
    file: ${OPENBAO_ROLE_ID_FILE:-./secrets/openbao_role_id}
  openbao_secret_id:
    file: ${OPENBAO_SECRET_ID_FILE:-./secrets/openbao_secret_id}
  openbao_static_seal_key:
    file: ${OPENBAO_STATIC_SEAL_KEY_FILE:-./secrets/openbao_static_seal_key}
